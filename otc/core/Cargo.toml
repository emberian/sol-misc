[package]
name = "dregg-otc-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "The pure, Verus-verified core of dregg-otc: byte layouts, instruction parsing, and the decision that turns account facts into a plan of token moves."

[lib]
path = "src/lib.rs"

[dependencies]
vstd = { workspace = true }
verus_builtin_macros = { workspace = true }
verus_builtin = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_keep_ghost)"] }
