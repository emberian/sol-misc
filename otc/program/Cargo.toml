[package]
name = "dregg-otc"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "A passphrase-claimable token escrow: the maker deposits token A and names a claim key; whoever holds that key pays token B and receives A, atomically."

[lib]
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
dregg-otc-core = { path = "../core" }
pinocchio = { version = "0.11.2", features = ["cpi"] }


